<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Daun padi dengan bercak penyakit</title>
  <desc id="desc">Ilustrasi daun padi hijau dengan bercak penyakit, tema warna AgriNova.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12231C"/>
      <stop offset="1" stop-color="#1C6B4F"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C6B4F"/>
      <stop offset="1" stop-color="#0E3D2C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B87C4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B87C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>

  <g opacity="0.10" fill="none" stroke="#A85A2E" stroke-width="2">
    <path d="M-40 120 Q 200 60 440 130 T 940 120"/>
    <path d="M-40 220 Q 200 160 440 230 T 940 220"/>
    <path d="M-40 320 Q 200 260 440 330 T 940 320"/>
    <path d="M-40 720 Q 200 660 440 730 T 940 720"/>
  </g>

  <circle cx="150" cy="150" r="220" fill="url(#glow)"/>

  <!-- Daun utama -->
  <path d="M -60 860 C 240 700 360 420 300 60 C 420 380 420 680 700 880 C 420 820 120 900 -60 860 Z" fill="url(#leaf)"/>
  <path d="M 300 60 C 330 420 300 700 60 840" fill="none" stroke="#F4F2E9" stroke-opacity="0.35" stroke-width="3"/>
  <path d="M 620 740 C 560 560 560 380 560 240" fill="none" stroke="#F4F2E9" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M 480 780 C 440 620 440 460 440 330" fill="none" stroke="#F4F2E9" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Bercak penyakit -->
  <g fill="#A85A2E">
    <circle cx="430" cy="300" r="16" opacity="0.85"/>
    <circle cx="480" cy="360" r="11" opacity="0.7"/>
    <circle cx="560" cy="430" r="20" opacity="0.8"/>
    <circle cx="540" cy="540" r="12" opacity="0.6"/>
    <circle cx="620" cy="600" r="15" opacity="0.75"/>
    <circle cx="360" cy="520" r="13" opacity="0.65"/>
    <circle cx="400" cy="640" r="10" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#D9A441" stroke-width="2" opacity="0.7">
    <circle cx="430" cy="300" r="24"/>
    <circle cx="560" cy="430" r="28"/>
    <circle cx="620" cy="600" r="22"/>
  </g>

  <!-- Grid data halus -->
  <g stroke="#3B87C4" stroke-opacity="0.22" stroke-width="1">
    <path d="M60 60 H840 M60 180 H840 M60 300 H840 M60 420 H840 M60 540 H840 M60 660 H840 M60 780 H840"/>
    <path d="M60 60 V840 M180 60 V840 M300 60 V840 M420 60 V840 M540 60 V840 M660 60 V840 M780 60 V840"/>
  </g>
</svg>
